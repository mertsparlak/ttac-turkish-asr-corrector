[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttac"
version = "0.1.0"
description = "Turkish Technical ASR Corrector evidence pilot"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ttac = "ttac.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ttac"]
